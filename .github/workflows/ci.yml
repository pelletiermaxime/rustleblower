name: Linux checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      packages:
        type: boolean
        default: false
      release_tag:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: linux-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  linux:
    name: Core checks and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
        with:
          cache-key: ${{ inputs.packages && 'linux-release-x86_64' || 'linux-x86_64' }}
      - name: Formatting
        run: python3 scripts/cargo.py fmt --all --check
      - name: Verification helper guards
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build portable usage collector and check its transport
        run: |
          python3 scripts/bandwidth/build.py --portable
          python3 scripts/bandwidth/test_verify.py
          python3 scripts/bandwidth/test_transport.py --build target/bandwidth
      - name: Clippy
        run: python3 scripts/cargo.py clippy --all-targets --all-features --locked -- -D warnings
      - name: Core protocol and persistence tests
        run: python3 scripts/owned_net.py --evidence .verification/core-network.json -- python3 scripts/cargo.py test --no-default-features --locked
      - name: Private desktop notification bus tests
        run: python3 scripts/cargo.py test --lib app::desktop_notifications::tests --locked
      - name: Check release tag and notes
        if: inputs.packages
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag and Cargo version differ'
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' or os.environ['GITHUB_REF_NAME'] == os.environ['RELEASE_TAG'], 'Unexpected release ref'
          assert pathlib.Path(f'docs/releases/v{version}.md').is_file(), 'Release notes missing'
          PYCODE
      - name: Build Linux release
        if: inputs.packages
        run: python3 scripts/cargo.py build --release --locked
      - name: Create AppImage, Debian package and archive
        if: inputs.packages
        run: bash scripts/package-linux.sh "$RELEASE_TAG"
      - name: Verify packages on clean Ubuntu
        if: inputs.packages
        run: python3 scripts/verify-packages.py
      - name: Preserve Linux packages
        if: inputs.packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: target/packages/*
          if-no-files-found: error
          compression-level: 0

  headless:
    name: Kit headless tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
        with:
          cache-key: linux-kit-x86_64
      - name: Build headless test binary
        run: python3 scripts/cargo.py test --lib --features headless-tests --no-run --locked --offline
      - name: Headless Kit interaction journeys
        run: python3 scripts/verify-headless.py --all --evidence .verification/headless/ci --timeout 120
      - name: Preserve Kit proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-kit-proof
          path: .verification/headless/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
