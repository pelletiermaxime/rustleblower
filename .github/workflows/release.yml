name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated tag matching Cargo.toml; select that tag as the workflow ref
        type: string
        required: true

permissions:
  contents: read

jobs:
  release-target:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Verify the existing annotated release tag before expensive checks
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, subprocess, tomllib
          tag = os.environ['RELEASE_TAG']
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          assert tag == f'v{version}', 'Tag and Cargo version differ'
          assert pathlib.Path(f'docs/releases/{tag}.md').is_file(), 'Release notes missing'
          ref = f'refs/tags/{tag}'
          assert subprocess.run(['git', 'show-ref', '--verify', '--quiet', ref]).returncode == 0, 'Push the annotated release tag with maintainer credentials first'
          assert subprocess.check_output(['git', 'cat-file', '-t', ref], text=True).strip() == 'tag', 'Release tags must be annotated'
          commit = subprocess.check_output(['git', 'rev-parse', f'{ref}^{{commit}}'], text=True).strip()
          assert commit == os.environ['GITHUB_SHA'], 'Select the existing tag as the workflow ref; it must match the checked commit'
          print(f'Verified {tag} at {commit}')
          PYCODE

  checks-and-packages:
    needs: release-target
    uses: ./.github/workflows/ci.yml
    with:
      packages: true
      release_tag: ${{ inputs.tag || github.ref_name }}

  publish:
    needs: checks-and-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: dist
      - name: Verify package checksums
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --latest --title "Rustleblower $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
