name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: New prerelease tag matching Cargo.toml (created after checks)
        type: string
        required: true

permissions:
  contents: read

jobs:
  checks-and-packages:
    uses: ./.github/workflows/ci.yml
    with:
      packages: true
      release_tag: ${{ inputs.tag || github.ref_name }}

  publish:
    needs: checks-and-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: dist
      - name: Verify package checksums
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Rustleblower $RELEASE_TAG development prerelease"
            gh auth setup-git
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --prerelease --title "Rustleblower $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
