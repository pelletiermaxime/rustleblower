name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks-and-packages:
    uses: ./.github/workflows/ci.yml
    with:
      packages: true

  publish:
    needs: checks-and-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: dist
      - name: Verify package checksums
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Publish first development release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --prerelease --title "Rustleblower $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
